name: Android CI

on:
  push:
    branches:
      - "arena/01a10467-kinetic-notes2"
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Create a GitHub release containing the installable EXP APK"
        required: false
        default: false
        type: boolean

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # The debug signing config in app/build.gradle.kts points at a keystore that is
      # intentionally git-ignored, so CI generates a throwaway one.
      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build + unit tests + lint
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug lintDebug \
            --stacktrace --no-configuration-cache --console=plain 2>&1 | tee -a ci.log

      - name: Package installable EXP APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Kinetic Canvas EXP.apk"

      # GitHub's artifact/release storage is not reachable from the Arena sandbox. For this
      # one publish run, also place a temporary copy in a [skip ci] commit so the agent can
      # retrieve the binary over the normal authenticated Git transport and present it here.
      - name: Attach APK for sandbox retrieval
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')
        run: |
          cp "dist/Kinetic Canvas EXP.apk" kinetic-canvas-exp.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kinetic-canvas-exp.apk
          git commit -m "ci: attach EXP APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish EXP APK release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="kinetic-canvas-exp-${GITHUB_SHA:0:7}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Kinetic Canvas EXP ${GITHUB_SHA:0:7}" \
            --notes "Installable Kinetic Canvas EXP debug build. This uses a separate application ID and can be installed alongside the regular app." \
            "dist/Kinetic Canvas EXP.apk"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          if-no-files-found: ignore
          path: |
            ci.log
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            dist/Kinetic Canvas EXP.apk

      # GitHub's raw log host is not reachable from the agent sandbox, so failures are
      # republished through the REST API (readable with `gh issue view`).
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo '```'
            if [ -f ci.log ]; then
              grep -E "^(e: |w: |FAILURE|\* What went wrong|\* Try|Caused by|Execution failed|> Task .*FAILED|[A-Za-z0-9_.]+ > .* FAILED)" ci.log | tail -n 120
              echo "----- tail of ci.log -----"
              tail -n 120 ci.log
            else
              echo "no ci.log produced"
            fi
            echo '```'
          } > body.md
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            if grep -q "<failure" "$f"; then
              {
                echo ""
                echo "### $(basename "$f")"
                echo '```'
                sed -n 's/.*<failure[^>]*message="\([^"]*\)".*/\1/p' "$f" | head -n 20
                echo '```'
              } >> body.md
            fi
          done
          gh issue create --title "CI failure ${GITHUB_SHA:0:7}" --body-file body.md
