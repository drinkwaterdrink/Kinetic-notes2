name: Android CI

on:
  push:
    branches:
      - "arena/01a10467-kinetic-notes2"
  workflow_dispatch:
    inputs:
      publish_apk:
        description: "Create a GitHub release containing the installable EXP APK"
        required: false
        default: false
        type: boolean

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Validation never needs write access to repository contents. The optional publication job
# below has its own explicit contents: write permission and cannot run unless validation passes.
permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build, unit test, lint, migration, and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # The EXP debug build uses this key. Without the repository secret the artifact is
      # intentionally ephemeral and must not be recommended as an update to an existing app.
      - name: Prepare EXP signing key
        env:
          KX_EXP_KEYSTORE_B64: ${{ secrets.KX_EXP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KX_EXP_KEYSTORE_B64" ]; then
            printf '%s' "$KX_EXP_KEYSTORE_B64" | base64 --decode > debug.keystore
            echo "Using the configured EXP signing key."
          elif [ ! -f debug.keystore ]; then
            echo "No stable EXP signing secret is configured; generating an ephemeral validation key."
            echo "Release publication is blocked until KX_EXP_KEYSTORE_B64 is configured."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # This action provides dependency/build caching. All actual builds below use the
      # checked-in, checksum-pinned Gradle Wrapper rather than a runner-global Gradle binary.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build + unit tests + lint
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug lintDebug \
            --stacktrace --no-configuration-cache --console=plain 2>&1 | tee -a ci.log

      - name: Package installable EXP APK
        id: package_apk
        env:
          KX_EXP_KEYSTORE_B64: ${{ secrets.KX_EXP_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          exec > >(tee -a ci.log) 2>&1
          echo "phase=apk-packaging"
          echo "APK outputs:"
          find app/build/outputs/apk -maxdepth 3 -type f -name '*.apk' -print -exec ls -l {} \; || true
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          echo "selected_apk=$apk"
          test -n "$apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/Kinetic Canvas EXP.apk"
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "aapt=$aapt_bin"
          echo "apksigner=$apksigner_bin"
          test -f "$aapt_bin"
          test -f "$apksigner_bin"
          echo "aapt badging:"
          "$aapt_bin" dump badging "$apk" | tee dist/aapt-badging.txt
          echo "apksigner certificates:"
          "$apksigner_bin" verify --print-certs "$apk" | tee dist/apksigner-certs.txt
          package_line=$(sed -n "s/^package: //p" dist/aapt-badging.txt | head -1)
          application_id=$(printf '%s\n' "$package_line" | awk -F"'" '{print $2}')
          version_code=$(printf '%s\n' "$package_line" | awk -F"'" '{print $4}')
          version_name=$(printf '%s\n' "$package_line" | awk -F"'" '{print $6}')
          fingerprint=$(sed -n 's/.*certificate SHA-256 digest: //p' dist/apksigner-certs.txt | head -1)
          echo "parsed_application_id=$application_id"
          echo "parsed_version_code=$version_code"
          echo "parsed_version_name=$version_name"
          echo "parsed_fingerprint=$fingerprint"
          test -n "$application_id"
          test -n "$version_code"
          test -n "$version_name"
          test -n "$fingerprint"
          sha256=$(sha256sum "$apk" | awk '{print $1}')
          {
            echo "commit_sha=$GITHUB_SHA"
            echo "application_id=$application_id"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "apk_sha256=$sha256"
            echo "signing_certificate_sha256=$fingerprint"
            if [ -n "$KX_EXP_KEYSTORE_B64" ]; then
              echo "signing_key_source=KX_EXP_KEYSTORE_B64"
              echo "update_compatibility=stable-key evidence is present in this build; compare this fingerprint with the installed EXP APK before updating"
            else
              echo "signing_key_source=ephemeral-validation-key"
              echo "update_compatibility=not safe to assume an update of an existing installation"
            fi
          } | tee "dist/Kinetic Canvas EXP.metadata.txt"
          metadata_summary=$(tr '\n' ' ' < "dist/Kinetic Canvas EXP.metadata.txt")
          echo "::notice title=EXP artifact metadata::$metadata_summary"
          {
            echo "### EXP artifact metadata"
            echo
            cat "dist/Kinetic Canvas EXP.metadata.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # APK delivery is separate from reports and never commits a binary to the source branch.
      - name: Upload EXP APK artifact
        if: steps.package_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-canvas-exp-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/Kinetic Canvas EXP.apk
            dist/Kinetic Canvas EXP.metadata.txt

      # Compile Android tests outside the emulator action. This makes compilation independently
      # observable even when the hosted emulator cannot boot or the action fails during startup.
      - name: Compile Android tests
        id: android_test_compile
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p app/build/ci-instrumentation
          ./gradlew :app:assembleDebugAndroidTest \
            --stacktrace --no-configuration-cache --no-daemon --console=plain \
            2>&1 | tee app/build/ci-instrumentation/android-test-compilation.log

      # GitHub's documented hardware-accelerated Android setup. The udev rule is intentionally
      # applied on every hosted runner before checking /dev/kvm; no emulator test is allowed to
      # proceed on an unaccelerated x86_64 host.
      - name: Enable KVM group permissions
        id: kvm_permissions
        if: steps.android_test_compile.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p app/build/ci-instrumentation
          {
            echo "phase=kvm-permission-setup"
            date -u
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            # GitHub's documented rule is authoritative; this explicit chmod handles runners
            # where the pre-existing static /dev/kvm node does not reapply its mode on trigger.
            sudo usermod -aG kvm "$USER" || true
            sudo chmod 0666 /dev/kvm
            echo "udev_rule=/etc/udev/rules.d/99-kvm4all.rules"
            ls -l /dev/kvm
            id
          } 2>&1 | tee app/build/ci-instrumentation/kvm-permission-setup.log

      # Use explicit emulator lifecycle steps so startup output is captured as an artifact
      # instead of being trapped in the action's step log when boot fails.
      - name: Prepare Android emulator image
        id: emulator_image
        if: steps.android_test_compile.outcome == 'success' && steps.kvm_permissions.outcome == 'success'
        run: |
          set +e
          mkdir -p app/build/ci-instrumentation
          {
            echo "phase=emulator-image-preparation"
            date -u
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" "emulator" "platforms;android-35" \
              "system-images;android-35;google_apis;x86_64"
            image_status=$?
            echo "sdkmanager_status=$image_status"
            export ANDROID_AVD_HOME="$RUNNER_TEMP/kinetic-avd"
            export ANDROID_SDK_HOME="$RUNNER_TEMP/kinetic-sdk-home"
            mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_SDK_HOME"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
            echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              --force --name kinetic-api35 --package "system-images;android-35;google_apis;x86_64" \
              --device "pixel_2"
            avd_status=$?
            echo "avdmanager_status=$avd_status"
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd
            exit "$((image_status != 0 || avd_status != 0))"
          } > app/build/ci-instrumentation/emulator-image-preparation.log 2>&1
          cat app/build/ci-instrumentation/emulator-image-preparation.log

      - name: Verify KVM access and emulator acceleration
        id: kvm_verify
        if: always() && steps.android_test_compile.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p app/build/ci-instrumentation
          {
            echo "phase=kvm-access-and-acceleration-verification"
            date -u
            if [ "${{ steps.kvm_permissions.outcome }}" != "success" ]; then
              echo "KVM permission setup did not pass: ${{ steps.kvm_permissions.outcome }}"
              exit 1
            fi
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            "$ANDROID_HOME/emulator/emulator" -accel-check
            acceleration_status=$?
            echo "emulator_accel_check_status=$acceleration_status"
            exit "$acceleration_status"
          } 2>&1 | tee app/build/ci-instrumentation/kvm-access-and-acceleration.log

      - name: Start Android emulator with diagnostics
        id: emulator_start
        if: steps.emulator_image.outcome == 'success' && steps.kvm_verify.outcome == 'success'
        run: |
          set +e
          mkdir -p app/build/ci-instrumentation
          log=app/build/ci-instrumentation/emulator-startup.log
          : > "$log"
          echo "phase=emulator-startup" >> "$log"
          date -u >> "$log"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kinetic-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/kinetic-sdk-home"
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$log"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME" >> "$log"
          echo "adb_bin=$adb_bin" >> "$log"
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM_REQUIRED: /dev/kvm is not readable and writable by this runner; x86_64 emulator execution is unavailable." >> "$log"
            ls -l /dev/kvm >> "$log" 2>&1 || true
            id >> "$log" 2>&1 || true
            exit 2
          fi
          "$adb_bin" start-server >> "$log" 2>&1
          "$emulator_bin" -avd kinetic-api35 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -verbose >> "$log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > app/build/ci-instrumentation/emulator.pid
          echo "emulator_pid=$emulator_pid" >> "$log"
          boot_completed=""
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            boot_completed=$("$adb_bin" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 2
          done
          {
            echo "boot_completed=$boot_completed"
            echo "phase=emulator-startup-summary"
            date -u
            "$adb_bin" devices -l
            "$adb_bin" shell getprop ro.build.version.sdk
            "$adb_bin" shell getprop sys.boot_completed
          } >> "$log" 2>&1
          if [ "$boot_completed" != "1" ]; then
            echo "Emulator did not report sys.boot_completed=1 within 300 seconds." >> "$log"
            exit 1
          fi
          exit 0

      # When the stable secret is configured, prove both certificate continuity and an
      # in-place update on this disposable emulator. Without the secret this remains an
      # explicit, non-passing skip; ephemeral builds must never be treated as upgrades.
      - name: Verify stable signing and disposable upgrade
        id: signing_upgrade
        if: always() && steps.emulator_start.outcome == 'success'
        continue-on-error: true
        env:
          KX_EXP_KEYSTORE_B64: ${{ secrets.KX_EXP_KEYSTORE_B64 }}
        run: |
          set +e
          mkdir -p app/build/ci-instrumentation
          log=app/build/ci-instrumentation/signing-upgrade.log
          : > "$log"
          if [ -z "$KX_EXP_KEYSTORE_B64" ]; then
            echo "stable_signing=not_configured" | tee "$log"
            echo "No stable signing secret was supplied; upgrade proof was not attempted." | tee -a "$log"
            exit 0
          fi
          apk_one=app/build/outputs/apk/debug/app-debug.apk
          apk_two=app/build/ci-instrumentation/app-debug-consecutive.apk
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          cp "$apk_one" app/build/ci-instrumentation/app-debug-first.apk
          ./gradlew :app:assembleDebug --rerun-tasks --stacktrace --no-configuration-cache --no-daemon --console=plain \
            >> "$log" 2>&1
          build_two_status=$?
          cp "$apk_one" "$apk_two"
          first_fingerprint=$("$apksigner_bin" verify --print-certs app/build/ci-instrumentation/app-debug-first.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          second_fingerprint=$("$apksigner_bin" verify --print-certs "$apk_two" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          {
            echo "stable_signing=required"
            echo "consecutive_build_status=$build_two_status"
            echo "first_certificate_sha256=$first_fingerprint"
            echo "second_certificate_sha256=$second_fingerprint"
          } | tee -a "$log"
          if [ "$build_two_status" -ne 0 ] || [ -z "$first_fingerprint" ] || [ "$first_fingerprint" != "$second_fingerprint" ]; then
            echo "Stable signing continuity failed." | tee -a "$log"
            exit 1
          fi
          "$adb_bin" install -r app/build/ci-instrumentation/app-debug-first.apk >> "$log" 2>&1
          first_install_status=$?
          "$adb_bin" install -r "$apk_two" >> "$log" 2>&1
          second_install_status=$?
          echo "first_install_status=$first_install_status" | tee -a "$log"
          echo "second_install_status=$second_install_status" | tee -a "$log"
          if [ "$first_install_status" -ne 0 ] || [ "$second_install_status" -ne 0 ]; then
            echo "Stable-signed disposable upgrade failed; do not recommend an in-place update." | tee -a "$log"
            exit 1
          fi
          echo "stable_signed_disposable_upgrade=passed" | tee -a "$log"
          exit 0

      - name: Instrumented migration and persistence checks
        id: instrumentation
        if: always() && steps.emulator_start.outcome == 'success'
        run: |
          set +e
          mkdir -p app/build/ci-instrumentation
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kinetic-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/kinetic-sdk-home"
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          "$adb_bin" logcat -c >/dev/null 2>&1 || true
          ./gradlew :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.NoteDatabaseMigrationTest \
            --stacktrace --no-configuration-cache --no-daemon --console=plain \
            > app/build/ci-instrumentation/migration-test-execution.log 2>&1
          migration_status=$?
          "$adb_bin" logcat -d > app/build/ci-instrumentation/emulator-logcat.log 2>&1 || true
          {
            echo "phase=post-test"
            echo "android_test_compilation_status=${{ steps.android_test_compile.outcome }}"
            echo "emulator_start_status=${{ steps.emulator_start.outcome }}"
            echo "migration_test_status=$migration_status"
            date -u
            "$adb_bin" devices -l
            "$adb_bin" shell getprop sys.boot_completed
          } > app/build/ci-instrumentation/test-summary.log 2>&1
          cat app/build/ci-instrumentation/emulator-startup.log
          cat app/build/ci-instrumentation/migration-test-execution.log
          cat app/build/ci-instrumentation/test-summary.log
          exit "$migration_status"

      - name: Stop emulator and collect final logs
        if: always()
        run: |
          mkdir -p app/build/ci-instrumentation
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kinetic-avd"
          export ANDROID_SDK_HOME="$RUNNER_TEMP/kinetic-sdk-home"
          adb_bin="$ANDROID_HOME/platform-tools/adb"
          timeout 30s "$adb_bin" logcat -d > app/build/ci-instrumentation/emulator-logcat-final.log 2>&1 || true
          timeout 30s "$adb_bin" shell dumpsys activity processes > app/build/ci-instrumentation/emulator-processes.log 2>&1 || true
          timeout 30s "$adb_bin" emu kill >> app/build/ci-instrumentation/emulator-shutdown.log 2>&1 || true
          if [ -f app/build/ci-instrumentation/emulator.pid ]; then
            kill "$(cat app/build/ci-instrumentation/emulator.pid)" 2>/dev/null || true
          fi

      # Record each gate explicitly so the diagnostic artifact says whether compilation,
      # image preparation, boot, or instrumentation was reached.
      - name: Record connected-test runner status
        if: always()
        run: |
          mkdir -p app/build/ci-instrumentation
          {
            echo "android_test_compilation_outcome=${{ steps.android_test_compile.outcome }}"
            echo "kvm_permissions_outcome=${{ steps.kvm_permissions.outcome }}"
            echo "emulator_image_outcome=${{ steps.emulator_image.outcome }}"
            echo "kvm_verify_outcome=${{ steps.kvm_verify.outcome }}"
            echo "emulator_start_outcome=${{ steps.emulator_start.outcome }}"
            echo "signing_upgrade_outcome=${{ steps.signing_upgrade.outcome }}"
            echo "instrumentation_outcome=${{ steps.instrumentation.outcome }}"
            if [ "${{ steps.android_test_compile.outcome }}" != "success" ]; then
              echo "phase_logs=absent; Android-test compilation failed, so emulator execution was not attempted"
            elif [ "${{ steps.kvm_permissions.outcome }}" != "success" ]; then
              echo "phase_logs=present; documented KVM permission setup failed"
            elif [ "${{ steps.emulator_image.outcome }}" != "success" ]; then
              echo "phase_logs=absent; emulator image preparation failed"
            elif [ "${{ steps.kvm_verify.outcome }}" != "success" ]; then
              echo "phase_logs=present; KVM access/acceleration verification failed"
            elif [ "${{ steps.emulator_start.outcome }}" != "success" ]; then
              echo "phase_logs=present; emulator startup failed before instrumentation"
            elif [ -f app/build/ci-instrumentation/migration-test-execution.log ]; then
              echo "phase_logs=present; emulator reached instrumentation"
            else
              echo "phase_logs=absent; instrumentation was not reached"
            fi
          } > app/build/ci-instrumentation/emulator-runner-status.log
          cat app/build/ci-instrumentation/emulator-runner-status.log

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-canvas-ci-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            ci.log
            app/build/ci-instrumentation/**
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/logs/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml

      - name: Enforce mandatory Android-test phases
        if: always()
        env:
          KX_EXP_KEYSTORE_B64: ${{ secrets.KX_EXP_KEYSTORE_B64 }}
        run: |
          compile_outcome="${{ steps.android_test_compile.outcome }}"
          kvm_setup_outcome="${{ steps.kvm_permissions.outcome }}"
          image_outcome="${{ steps.emulator_image.outcome }}"
          kvm_verify_outcome="${{ steps.kvm_verify.outcome }}"
          emulator_outcome="${{ steps.emulator_start.outcome }}"
          signing_upgrade_outcome="${{ steps.signing_upgrade.outcome }}"
          instrumentation_outcome="${{ steps.instrumentation.outcome }}"
          if [ "$compile_outcome" != "success" ]; then
            echo "Android-test compilation did not pass: $compile_outcome"
            exit 1
          fi
          if [ "$kvm_setup_outcome" != "success" ]; then
            echo "KVM permission setup did not pass: $kvm_setup_outcome"
            exit 1
          fi
          if [ "$image_outcome" != "success" ]; then
            echo "Emulator image preparation did not pass: $image_outcome"
            exit 1
          fi
          if [ "$kvm_verify_outcome" != "success" ]; then
            echo "KVM access/acceleration verification did not pass: $kvm_verify_outcome"
            exit 1
          fi
          if [ "$emulator_outcome" != "success" ]; then
            echo "Emulator startup did not pass: $emulator_outcome"
            exit 1
          fi
          if [ -n "$KX_EXP_KEYSTORE_B64" ] && [ "$signing_upgrade_outcome" != "success" ]; then
            echo "Stable signing continuity/upgrade did not pass: $signing_upgrade_outcome"
            exit 1
          fi
          if [ "$instrumentation_outcome" != "success" ]; then
            echo "Migration instrumentation did not pass: $instrumentation_outcome"
            exit 1
          fi

      # GitHub's raw log host is not reachable from the Arena sandbox, so failures are
      # republished through the REST API. The artifact above remains the complete report.
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo '```'
            if [ -f ci.log ]; then
              grep -E "^(e: |w: |FAILURE|\* What went wrong|\* Try|Caused by|Execution failed|> Task .*FAILED|[A-Za-z0-9_.]+ > .* FAILED)" ci.log | tail -n 120 || true
              echo "----- tail of ci.log -----"
              tail -n 120 ci.log
            else
              echo "no ci.log produced"
            fi
            for f in app/build/ci-instrumentation/migration-test-execution.log \
                     app/build/ci-instrumentation/test-summary.log \
                     app/build/ci-instrumentation/emulator-runner-status.log \
                     app/build/ci-instrumentation/emulator-startup.log \
                     app/build/ci-instrumentation/signing-upgrade.log; do
              [ -f "$f" ] || continue
              echo "----- $f -----"
              tail -n 160 "$f"
            done
            echo '```'
          } > body.md
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            if grep -q "<failure" "$f"; then
              {
                echo ""
                echo "### $(basename "$f")"
                echo '```'
                sed -n 's/.*<failure[^>]*message="\([^"]*\)".*/\1/p' "$f" | head -n 20
                echo '```'
              } >> body.md
            fi
          done
          # Keep the issue small enough for GitHub while retaining the migration failure and
          # phase status. The complete report remains in the uploaded artifact.
          if [ "$(wc -c < body.md)" -gt 60000 ]; then
            head -c 60000 body.md > body-truncated.md
            printf '\n\n[body truncated; see the diagnostic artifact]\n' >> body-truncated.md
            mv body-truncated.md body.md
          fi
          gh issue create --title "CI failure ${GITHUB_SHA:0:7}" --body-file body.md

  publish:
    name: Publish APK release (manual and gated)
    needs: build
    if: >-
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_apk == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kinetic-canvas-exp-apk-${{ github.sha }}
          path: dist

      - name: Verify stable signing secret before publication
        env:
          KX_EXP_KEYSTORE_B64: ${{ secrets.KX_EXP_KEYSTORE_B64 }}
        run: |
          test -n "$KX_EXP_KEYSTORE_B64" || {
            echo "Refusing APK publication: configure the stable KX_EXP_KEYSTORE_B64 secret first."
            exit 1
          }
          test -f "dist/Kinetic Canvas EXP.apk"
          test -f "dist/Kinetic Canvas EXP.metadata.txt"
          grep -q 'signing_key_source=KX_EXP_KEYSTORE_B64' "dist/Kinetic Canvas EXP.metadata.txt"

      - name: Publish EXP APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="kinetic-canvas-exp-${GITHUB_SHA:0:7}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Kinetic Canvas EXP ${GITHUB_SHA:0:7}" \
            --notes "Installable Kinetic Canvas EXP debug build. This uses a separate application ID and can be installed alongside the regular app." \
            "dist/Kinetic Canvas EXP.apk"
